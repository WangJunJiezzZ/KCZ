# 二次开发：云端编译 / 发布「看锤子」电视版
# - 推送到 custom-561：只编译检查，APK 在本次运行页面底部的 Artifacts 里下载（不推给电视）
# - 手动运行（Actions → 编译 APK → Run workflow）并勾选"发布"：
#     1. 编译电视版 APK（arm64 + armv7），用你的密钥签名
#     2. 上传到 GitHub Releases（标签 v版本名）
#     3. 生成版本信息 leanback.json 到 release 分支，刷新 jsDelivr 缓存
#   电视上的看锤子下次打开就会提示更新。发布前记得把 gradle.properties 里的 customVersionCode / customVersionName +1
name: 编译 APK

on:
  push:
    branches: [custom-561]
  workflow_dispatch:
    inputs:
      publish:
        description: 发布更新（电视上的 App 会提示更新）
        type: boolean
        default: false
      notes:
        description: 更新说明（显示在电视的更新弹窗里）
        type: string
        default: 界面和功能优化

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          path: TV

      - name: 读取版本号
        id: ver
        run: |
          code=$(grep -E '^customVersionCode=' TV/gradle.properties | cut -d= -f2 | tr -d '\r ')
          name=$(grep -E '^customVersionName=' TV/gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "版本：$name ($code)"

      - name: 检查版本号是否已发布过
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::版本 v${{ steps.ver.outputs.name }} 已经发布过了。请先在 gradle.properties 里把 customVersionCode 和 customVersionName 加 1 再发布"
            exit 1
          fi

      - name: 检出播放器内核源码 (FongMi/media)
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: release-1.11.0-fongmi
          path: media

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Python 3.10（App 内置 Python 打包需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译播放器内核 aar
        working-directory: media
        run: |
          tasks=$(sed -e 's/-release\.aar$//' -e 's/^/:/' -e 's/$/:assembleRelease/' ../TV/.github/media-modules.txt | tr '\n' ' ')
          bash ./gradlew $tasks --stacktrace

      - name: 复制 aar 到 app/libs
        run: |
          while read -r name; do
            [ -z "$name" ] && continue
            file=$(find media/libraries -path '*/outputs/aar/*' -name "$name" | head -n 1)
            if [ -z "$file" ]; then echo "::error::找不到 $name"; exit 1; fi
            cp "$file" TV/app/libs/
          done < TV/.github/media-modules.txt

      - name: 写入签名配置和 TMDB 密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          # 没配 TMDB_KEY 也能编译，只是首页没有 TMDB 高清剧照（退回海报）
          if [ -z "$TMDB_KEY" ]; then echo "::warning::没配置 TMDB_KEY Secret，这次编译的 App 首页不会显示 TMDB 高清剧照"; fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::还没配置签名密钥。请在仓库 Settings -> Secrets and variables -> Actions 添加 KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$KEY_PASSWORD"
            echo "tmdbKey=$TMDB_KEY"
          } > TV/local.properties

      - name: 编译电视版 APK
        working-directory: TV
        # 上游仓库里 gradlew 没有可执行权限，用 bash 调用；失败时把关键报错摘成注释
        run: |
          set -o pipefail
          # 云端机器有 16GB 内存，项目默认只给 Gradle 2GB，打包 APK 时会内存不足（OutOfMemoryError）
          sed -i -E 's/^org\.gradle\.jvmargs=-Xmx[0-9]+[mg]/org.gradle.jvmargs=-Xmx6g/' gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties
          tasks=":app:assembleLeanbackArm64_v8aRelease :app:assembleLeanbackArmeabi_v7aRelease"
          if ! bash ./gradlew $tasks --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -E '(error:|^e: |What went wrong|> Task .* FAILED|Could not|cannot find symbol|No space left|OutOfMemory)' "$RUNNER_TEMP/build.log" \
              | grep -v '^\s*at ' | head -n 40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            grep -A 12 'What went wrong' "$RUNNER_TEMP/build.log" | head -n 40 | while IFS= read -r line; do echo "::warning::${line:0:900}"; done
            df -h / | while IFS= read -r line; do echo "::warning::磁盘 $line"; done
            exit 1
          fi

      - name: 收集 APK
        run: |
          mkdir -p out
          find TV/app/build/outputs/apk -name 'leanback-*.apk' -path '*/release/*' -exec cp {} out/ \;
          ls -la out

      - name: 上传 APK（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: kanchuizi-${{ steps.ver.outputs.name }}-${{ github.run_number }}
          path: out/*.apk

      - name: 发布到 GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 看锤子 ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: ${{ inputs.notes }}

      - name: 更新版本信息（release 分支的 leanback.json）并刷新 jsDelivr
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir rel && cd rel
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin release 2>/dev/null; then git checkout -q -b release FETCH_HEAD; else git checkout -q --orphan release; fi
          jq -n --arg name "$NAME" --argjson code "$CODE" --arg desc "$NOTES" '{name: $name, code: $code, desc: $desc}' > leanback.json
          cat leanback.json
          git add leanback.json
          git commit -q -m "发布 $NAME"
          git push -q origin HEAD:release
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/leanback.json" || true
