org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.tooling.parallel=true

# ===== 二次开发自定义项（只改这里）=====
# 包名：和原版"影视"不同，两个 App 可以同时安装
customAppId=io.github.wangjunjiezzz.tv
# 首次安装时内置的点播配置（逗号分隔可写多个，都会出现在「设置 → 点播」历史里，第一个为默认；留空 = 和原版一样手动填写）
# 目前：① 9280.kstore.vip（默认，带配置中心）② 饭太硬（www.饭太硬.cc，这里写 punycode）③ 多仓（tvbox.xn--4kq62z5rby2qupq9ub.top）
customVodUrl=https://9280.kstore.vip/aiwex.json,http://www.xn--sss604efuw.cc/tv,http://tvbox.xn--4kq62z5rby2qupq9ub.top/
# ===== 版本号（每次发布更新前 +1；电视上的 App 只会提示比自己大的版本）=====
customVersionCode=56103
customVersionName=5.6.1.3
# ===== 自己的更新渠道 =====
# 版本信息 JSON（很小，走 jsDelivr，国内快）：<地址>/leanback.json，由云端发布流程自动生成到 KCZ 的 release 分支
customUpdateJson=https://cdn.jsdelivr.net/gh/WangJunJiezzZ/KCZ@release
# APK 下载地址（约 90MB，走 GitHub Releases 最新版本）：<地址>/leanback-arm64_v8a.apk
# 也可以在 JSON 里写 "apk" 字段覆盖它，换下载服务器不用重新打包
customUpdateApk=https://github.com/WangJunJiezzZ/KCZ/releases/latest/download
# App 显示名在 app/src/main/res/values*/strings.xml 的 app_name 中修改（这里写中文会乱码）
