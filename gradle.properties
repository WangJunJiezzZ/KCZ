org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.tooling.parallel=true

# ===== 二次开发自定义项（只改这里）=====
# 包名：和原版"影视"不同，两个 App 可以同时安装
customAppId=io.github.wangjunjiezzz.tv
# 首次打开时自动加载的配置地址（留空 = 和原版一样，需要手动填写）
# 用 jsDelivr 代理 GitHub：raw.githubusercontent.com 在国内常被 DNS 污染（解析成 127.0.0.1）
# 更新配置后 jsDelivr 最多缓存 12 小时，想立即生效就访问一次：
#   https://purge.jsdelivr.net/gh/WangJunJiezzZ/KCZ@config/config.json
customVodUrl=
# 检查更新时读取哪个 GitHub 仓库的 Releases
customUpdateRepo=WangJunJiezzZ/KCZ
# App 显示名在 app/src/main/res/values*/strings.xml 的 app_name 中修改（这里写中文会乱码）
